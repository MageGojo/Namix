[package]
name = "namix-http"
version.workspace = true
edition.workspace = true
description = "Namix HTTP 核心：server / routing / middleware / extract（hyper + h2 + h3）"

[features]
default = []
models = []
services = []
requests = []
pages = []

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
inventory = "0.3"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server", "http2", "server-auto"] }
quinn = { version = "0.11.11", default-features = false, features = ["bloom", "log", "runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = "0.14.8"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tracing = "0.1"
thiserror = { workspace = true }
