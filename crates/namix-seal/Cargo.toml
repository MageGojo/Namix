[package]
name = "namix-seal"
version.workspace = true
edition.workspace = true
description = "Browser WASM：#[server] 请求密封（抬高 DevTools 逆向门槛）"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hkdf = "0.12"
js-sys = "0.3"
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Headers",
  "Document",
  "HtmlDocument",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "RequestMode",
  "Response",
  "Window",
] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[build-dependencies]
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
